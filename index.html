function Reveal({ children, delay = 0, y = 28, className = "", as = "div" }) {
  const reduce = useReducedMotion();
  const Tag = motion[as];
  return (
    <Tag
      className={className}
      initial={reduce ? false : { opacity: 0.3, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: "0px 0px -8% 0px" }}
      transition={{ duration: 0.85, ease: EASE, delay }}
    >
      {children}
    </Tag>
  );
}

function Counter({ to, suffix = "", decimals = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "0px 0px -10% 0px" });
  const reduce = useReducedMotion();
  const [v, setV] = useState(to);
  useEffect(() => {
    if (!inView || reduce) return undefined;
    let raf;
    let start = null;
    const dur = 1700;
    setV(0);
    const tick = (t) => {
      if (start === null) start = t;
      const p = Math.min((t - start) / dur, 1);
      setV(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, reduce, to]);
  const shown = decimals
    ? v.toFixed(decimals).replace(".", ",")
    : Math.round(v).toLocaleString("pl-PL");
  return (
    <span ref={ref} className="tabular-nums">
      {shown}
      {suffix}
    </span>
  );
}

}

/* ---------- WIDGET REZERWACJI WIZYTY ----------------------------------- */

function Booking() {
  const [selectedService, setSelectedService] = useState(SERVICES[3].id);
  const [selectedBarber, setSelectedBarber] = useState(TEAM[0].name);
  const [selectedDate, setSelectedDate] = useState("Jutro");
  const [selectedTime, setSelectedTime] = useState("14:00");
  const [submitted, setSubmitted] = useState(false);

  const currentService = SERVICES.find((s) => s.id === selectedService) || SERVICES[0];

  const handleSubmit = (e) => {
    e.preventDefault();
    setSubmitted(true);
  };

  return (
    <section id="rezerwacja" className="scroll-mt-24 py-20 sm:py-28">
      <Container>
        <SectionHead eyebrow="System rezerwacyjny" title="Umów wizytę w minutę.">
          Wybierz protokół, specjalistę i wygodny termin. Oddzwonimy w celu potwierdzenia.
        </SectionHead>

        <Reveal className="glass rounded-[32px] p-6 sm:p-10">
          {submitted ? (
            <div className="text-center py-12">
              <div className="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-full bg-[#c9854f]/20 text-[#e8b27a]">
                <Check size={32} />
              </div>
              <h3 className="f-display text-3xl font-normal">Dziękujemy za zgłoszenie!</h3>
              <p className="muted mt-3 max-w-md mx-auto text-base">
                Otrzymaliśmy Twoją rezerwację na uslugę <strong>{currentService.name}</strong> u <strong>{selectedBarber}</strong> ({selectedDate}, godz. {selectedTime}).
              </p>
              <button
                type="button"
                onClick={() => setSubmitted(false)}
                className="btn btn-ghost mt-8"
              >
                Zarezerwuj kolejną wizytę
              </button>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="grid gap-8 lg:grid-cols-2">
              <div className="space-y-6">
                <div>
                  <label className="f-mono text-xs uppercase tracking-wider copper-hi block mb-3">1. Wybierz uslugę</label>
                  <div className="grid gap-2">
                    {SERVICES.map((s) => (
                      <button
                        key={s.id}
                        type="button"
                        onClick={() => setSelectedService(s.id)}
                        className={`flex items-center justify-between p-3.5 rounded-xl border text-left transition ${
                          selectedService === s.id
                            ? "border-[#c9854f] bg-[#c9854f]/10 text-white"
                            : "border-white/5 bg-white/[0.02] text-[#8e97a9] hover:border-white/20"
                        }`}
                      >
                        <div>
                          <div className="font-medium text-sm text-[#ece6dc]">{s.name}</div>
                          <div className="text-xs muted">{s.min} min</div>
                        </div>
                        <div className="f-display font-semibold text-lg text-[#e8b27a]">{s.price} zł</div>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="f-mono text-xs uppercase tracking-wider copper-hi block mb-3">2. Wybierz barbera</label>
                  <div className="grid grid-cols-2 gap-2">
                    {TEAM.map((t) => (
                      <button
                        key={t.name}
                        type="button"
                        onClick={() => setSelectedBarber(t.name)}
                        className={`p-3 rounded-xl border text-center transition ${
                          selectedBarber === t.name
                            ? "border-[#c9854f] bg-[#c9854f]/10 text-white"
                            : "border-white/5 bg-white/[0.02] text-[#8e97a9] hover:border-white/20"
                        }`}
                      >
                        <div className="font-medium text-sm text-[#ece6dc]">{t.name}</div>
                        <div className="text-[11px] muted">{t.role.split("·")[0]}</div>
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div className="space-y-6 flex flex-col justify-between">
                <div className="space-y-6">
                  <div>
                    <label className="f-mono text-xs uppercase tracking-wider copper-hi block mb-3">3. Wybierz termin</label>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {["Dziś", "Jutro", "Pojutrze"].map((d) => (
                        <button
                          key={d}
                          type="button"
                          onClick={() => setSelectedDate(d)}
                          className={`py-2.5 rounded-xl border text-center text-sm transition ${
                            selectedDate === d
                              ? "border-[#c9854f] bg-[#c9854f]/10 text-white"
                              : "border-white/5 bg-white/[0.02] text-[#8e97a9]"
                          }`}
                        >
                          {d}
                        </button>
                      ))}
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                      {["11:00", "12:30", "14:00", "15:30", "17:00", "18:30"].map((time) => (
                        <button
                          key={time}
                          type="button"
                          onClick={() => setSelectedTime(time)}
                          className={`py-2 rounded-lg border text-center text-xs f-mono transition ${
                            selectedTime === time
                              ? "border-[#c9854f] bg-[#c9854f]/10 text-white"
                              : "border-white/5 bg-white/[0.02] text-[#8e97a9]"
                          }`}
                        >
                          {time}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="f-mono text-xs uppercase tracking-wider copper-hi block mb-3">4. Twoje dane</label>
                    <div className="space-y-3">
                      <input
                        type="text"
                        required
                        placeholder="Imię i nazwisko"
                        className="w-full rounded-xl bg-white/[0.03] border border-white/10 px-4 py-3 text-sm focus:border-[#c9854f] focus:outline-none"
                      />
                      <input
                        type="tel"
                        required
                        placeholder="Numer telefonu"
                        className="w-full rounded-xl bg-white/[0.03] border border-white/10 px-4 py-3 text-sm focus:border-[#c9854f] focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                <button type="submit" className="btn btn-primary w-full !py-4 text-base">
                  Potwierdzam rezerwację ({currentService.price} zł)
                </button>
              </div>
            </form>
          )}
        </Reveal>
      </Container>
    </section>
  );
}
