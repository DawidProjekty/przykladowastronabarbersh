/* ---------- POMOCNICZE -------------------------------------------------- */

const EASE = [0.22, 1, 0.36, 1];

const prefersReducedMotion = () =>
  typeof window !== "undefined" &&
  window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
}

/** Pojawianie się sekcji przy przewijaniu. Start od 30% krycia, żeby treść
 *  była czytelna także na zrzucie ekranu bez przewijania. */
function Reveal({ children, delay = 0, y = 28, className = "", as = "div" }) {
  const reduce = useReducedMotion();
  const Tag = motion[as];
  return (
    <Tag
      className={className}
      initial={reduce ? false : { opacity: 0.3, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: "0px 0px -8% 0px" }}
      transition={{ duration: 0.85, ease: EASE, delay }}
    >
      {children}
    </Tag>
  );
}

function Photo({ src, alt = "", label, className = "", imgClassName = "" }) {
  const [failed, setFailed] = useState(false);
  return (
    <div className={`overflow-hidden ${className}`}>
      <div className="photo-fallback absolute inset-0" aria-hidden="true" />
      {failed && label ? (
        <span className="f-mono absolute bottom-3 left-3 text-[10px] uppercase tracking-[0.2em] muted">
          {label}
        </span>
      ) : null}
      {!failed ? (
        <img
          src={src}
          alt={alt}
          loading="lazy"
          decoding="async"
          onError={() => setFailed(true)}
          className={`absolute inset-0 h-full w-full object-cover ${imgClassName}`}
        />
      ) : null}
    </div>
  );
}

function SectionHead({ eyebrow, title, children, align = "left" }) {
  return (
    <Reveal className={`mb-12 max-w-2xl sm:mb-16 ${align === "center" ? "mx-auto text-center" : ""}`}>

      </h2>
      {children ? <p className="muted mt-5 text-base leading-relaxed sm:text-lg">{children}</p> : null}
    </Reveal>
  );
}

const Container = ({ children, className = "" }) => (
  <div className={`mx-auto w-full max-w-6xl px-4 sm:px-6 ${className}`}>{children}</div>
);

function Stars({ size = 16 }) {

      ))}

}

function GoogleWord({ className = "" }) {
  const c = ["#4285F4", "#EA4335", "#FBBC04", "#4285F4", "#34A853", "#EA4335"];
  return (
    <span className={`font-medium tracking-tight ${className}`} aria-label="Google">
      {"Google".split("").map((ch, i) => (
        <span key={i} style={{ color: c[i] }}>
          {ch}
        </span>
      ))}
    </span>
  );
}

function Counter({ to, suffix = "", decimals = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: "0px 0px -10% 0px" });
  const reduce = useReducedMotion();
  const [v, setV] = useState(to);
  useEffect(() => {
    if (!inView || reduce) return undefined;
    let raf;
    let start = null;
    const dur = 1700;
    setV(0);
    const tick = (t) => {
      if (start === null) start = t;
      const p = Math.min((t - start) / dur, 1);
      setV(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [inView, reduce, to]);
  const shown = decimals
    ? v.toFixed(decimals).replace(".", ",")
    : Math.round(v).toLocaleString("pl-PL");
  return (
    <span ref={ref} className="tabular-nums">
      {shown}
      {suffix}
    </span>
  );
}

    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);

  const go = (id) => (e) => {
    e.preventDefault();
    setOpen(false);
    scrollToId(id);
  };

    <header
      className="fixed inset-x-0 top-0 z-50"
      style={{ paddingTop: "env(safe-area-inset-top, 0px)" }}
    >

          initial={{ opacity: 0, y: -16 }}
          animate={{ opacity: 1, y: 0 }}
          transition={{ duration: 0.8, ease: EASE }}
          className={`gb flex items-center justify-between rounded-full px-3 py-2.5 sm:px-4 ${
            scrolled || open ? "glass" : ""
          }`}
          style={{ transition: "background .4s ease" }}
          aria-label="Główna nawigacja"
        >
          <a href="#top" onClick={go("top")} className="flex items-center gap-2.5 pl-1">

            </span>
          </a>

          <ul className="hidden items-center gap-1 md:flex">
            {NAV.map((n) => (
              <li key={n.id}>
                <a
                  href={`#${n.id}`}
                  onClick={go(n.id)}
                  className="muted rounded-full px-4 py-2 text-sm transition-colors hover:text-[#ece6dc]"

/* ---------- REZERWACJA -------------------------------------------------- */

const pad = (n) => String(n).padStart(2, "0");
const WEEKDAY = ["ndz", "pon", "wt", "śr", "czw", "pt", "sob"];
const MONTH = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];

function buildDays(count = 8) {
  const out = [];
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  for (let i = 0; out.length < count; i += 1) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    if (d.getDay() !== 0) out.push(d); // niedziela: nieczynne
  }
  return out;
}

function buildSlots(date) {
  const close = date.getDay() === 6 ? 16 : 20;
  const now = new Date();
  const isToday = date.toDateString() === now.toDateString();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const slots = [];
  for (let m = 10 * 60; m < close * 60; m += 30) {
    // Zajęte terminy są symulowane. Podłącz tu prawdziwy kalendarz.
    const seed = (date.getDate() * 31 + (m / 30) * 17 + date.getDay() * 7) % 100;
    const taken = seed < 32 || (isToday && m <= nowMin + 30);
    slots.push({ time: `${pad(Math.floor(m / 60))}:${pad(m % 60)}`, min: m, taken });
  }
  return slots;
}

function Booking({ service, setService }) {
  const days = useMemo(() => buildDays(8), []);
  const firstFree = useMemo(() => {
    const idx = days.findIndex((d) => buildSlots(d).some((s) => !s.taken));
    return idx === -1 ? 0 : idx;
  }, [days]);
  const [dayIdx, setDayIdx] = useState(firstFree);
  const [time, setTime] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const day = days[dayIdx];
  const slots = useMemo(() => buildSlots(day), [day]);
  const svc = SERVICES.find((s) => s.id === service) || SERVICES[0];
  const picked = slots.find((s) => s.time === time);
  const endTime = picked
    ? `${pad(Math.floor((picked.min + svc.min) / 60))}:${pad((picked.min + svc.min) % 60)}`
    : "";
  const dayLong = day.toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" });

  const submit = (e) => {
    e.preventDefault();
    if (!time) return setError("Wybierz godzinę wizyty.");
    if (name.trim().length < 2) return setError("Podaj imię, żebyśmy wiedzieli, kogo się spodziewać.");
    if (phone.replace(/\D/g, "").length < 9) return setError("Podaj numer telefonu z co najmniej 9 cyframi.");
    setError("");
    // TODO: wyślij dane do swojego API albo kalendarza rezerwacji.
    setDone(true);
  };

  const reset = () => {
    setDone(false);
    setTime("");
    setName("");
    setPhone("");
  };

  return (
    <section id="rezerwacja" className="scroll-mt-24 py-20 sm:py-28">
      <Container>
        <SectionHead eyebrow="Rezerwacja" title="Zarezerwuj fotel w trzy kliknięcia.">
          Wybierz usługę, dzień i godzinę. Zostaw numer, a potwierdzimy termin telefonicznie.
        </SectionHead>

        <Reveal>
          <div className="glass-solid gb overflow-hidden rounded-[30px]">
            <AnimatePresence mode="wait">
              {done ? (
                <motion.div
                  key="done"
                  initial={{ opacity: 0, y: 16 }}
                  animate={{ opacity: 1, y: 0 }}
                  exit={{ opacity: 0 }}
                  transition={{ duration: 0.5, ease: EASE }}
                  className="grid place-items-center px-6 py-16 text-center sm:py-24"
                >
                  <span className="logo-mark grid h-16 w-16 place-items-center rounded-full copper-hi">
                    <Check size={26} />
                  </span>
                  <h3 className="f-display mt-7 text-3xl sm:text-4xl">Zgłoszenie przyjęte, {name.trim()}.</h3>
                  <p className="muted mt-4 max-w-md text-base leading-relaxed">
                    {svc.name}, {dayLong}, {time}–{endTime}. Oddzwonimy na {phone}, żeby potwierdzić termin.
                  </p>
                  <p className="muted mt-3 max-w-md text-xs">
                    Podgląd demonstracyjny: formularz nie jest jeszcze połączony z kalendarzem rezerwacji.
                  </p>
                  <button type="button" onClick={reset} className="btn btn-ghost mt-8">
                    Nowa rezerwacja
                  </button>
                </motion.div>
              ) : (
                <motion.form
                  key="form"
                  onSubmit={submit}
                  noValidate
                  initial={false}
                  exit={{ opacity: 0 }}
                  className="grid gap-0 lg:grid-cols-[1.4fr_.8fr]"
                >
                  <div className="min-w-0 space-y-9 p-6 sm:p-10">
                    <fieldset className="min-w-0 border-0 p-0">
                      <legend className="f-mono mb-4 text-[11px] uppercase tracking-[0.22em] copper-hi">
                        1 · Usługa
                      </legend>
                      <div className="grid gap-2.5 sm:grid-cols-2">
                        {SERVICES.map((s) => (
                          <button
                            key={s.id}
                            type="button"
                            id={`svc-${s.id}`}

                    </fieldset>

                    <fieldset className="min-w-0 border-0 p-0">
                      <legend className="f-mono mb-4 text-[11px] uppercase tracking-[0.22em] copper-hi">
                        2 · Dzień
                      </legend>
                      <div className="noscroll -mx-1 flex gap-2.5 overflow-x-auto px-1 pb-2">
                        {days.map((d, i) => (
                          <button
                            key={d.toDateString()}
                            type="button"
                            id={`day-${i}`}
                            aria-pressed={dayIdx === i}
                            onClick={() => {
                              setDayIdx(i);
                              setTime("");
                            }}
                            className="chip flex w-[76px] shrink-0 flex-col items-center gap-1 py-3.5"
                          >
                            <span className="f-mono text-[11px] uppercase tracking-[0.14em] muted">
                              {WEEKDAY[d.getDay()]}
                            </span>
                            <span className="f-display text-2xl tabular-nums">{d.getDate()}</span>
                            <span className="f-mono text-[10px] uppercase muted">{MONTH[d.getMonth()]}</span>
                          </button>
                        ))}
                      </div>
                    </fieldset>

                    <fieldset className="min-w-0 border-0 p-0">
                      <legend className="f-mono mb-4 text-[11px] uppercase tracking-[0.22em] copper-hi">
                        3 · Godzina
                      </legend>
                      <div className="grid grid-cols-4 gap-2.5 sm:grid-cols-5">
                        {slots.map((s) => (
                          <button
                            key={s.time}
                            type="button"
                            id={`slot-${s.time.replace(":", "")}`}
                            disabled={s.taken}
                            aria-pressed={time === s.time}
                            onClick={() => setTime(s.time)}
                            className="chip f-mono py-3 text-[13px] tabular-nums"
                          >
                            {s.time}
                          </button>
                        ))}
                      </div>
                    </fieldset>

                    <div className="grid gap-4 sm:grid-cols-2">
                      <div className="min-w-0">
                        <label htmlFor="bk-name" className="f-mono mb-2 block text-[11px] uppercase tracking-[0.22em] copper-hi">
                          Imię
                        </label>
                        <input
                          id="bk-name"
                          className="field"
                          placeholder="Jak mamy się do Ciebie zwracać?"
                          autoComplete="given-name"
                          value={name}
                          onChange={(e) => setName(e.target.value)}
                        />
                      </div>
                      <div className="min-w-0">
                        <label htmlFor="bk-phone" className="f-mono mb-2 block text-[11px] uppercase tracking-[0.22em] copper-hi">
                          Telefon
                        </label>
                        <input
                          id="bk-phone"
                          className="field tabular-nums"
                          placeholder="+48 500 000 000"
                          type="tel"
                          inputMode="tel"
                          autoComplete="tel"
                          value={phone}
                          onChange={(e) => setPhone(e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  <aside className="min-w-0 border-t hair bg-black/20 p-6 sm:p-10 lg:border-l lg:border-t-0">
                    <div className="lg:sticky lg:top-28">
                      <span className="f-mono text-[11px] uppercase tracking-[0.22em] copper-hi">Podsumowanie</span>
                      <dl className="mt-6 space-y-5">
                        <div>
                          <dt className="muted text-xs">Usługa</dt>
                          <dd className="f-display mt-1 text-2xl">{svc.name}</dd>
                        </div>
                        <div>
                          <dt className="muted text-xs">Termin</dt>
                          <dd className="mt-1 flex items-start gap-2 text-[15px] capitalize ink">
                            <CalendarDays size={16} className="copper mt-1 shrink-0" />
                            <span>
                              {dayLong}
                              <span className="f-mono mt-1 block text-[13px] normal-case tabular-nums muted">
                                {time ? `${time} – ${endTime}` : "godzina niewybrana"}
                              </span>
                            </span>
                          </dd>
                        </div>
                        <div className="flex items-end justify-between gap-3 border-t hair pt-5">
                          <div>
                            <dt className="muted text-xs">Do zapłaty na miejscu</dt>
                            <dd className="f-display mt-1 text-4xl tabular-nums">{svc.price} zł</dd>
                          </div>
                          <span className="muted f-mono text-xs tabular-nums">{svc.min} min</span>
                        </div>
                      </dl>

                      <AnimatePresence>
                        {error ? (
                          <motion.p
                            role="alert"
                            initial={{ opacity: 0, y: 6 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0 }}
                            className="mt-6 rounded-2xl px-4 py-3 text-sm"
                            style={{ background: "rgba(232,120,100,.12)", color: "#f0a595" }}
                          >
                            {error}
                          </motion.p>
                        ) : null}
                      </AnimatePresence>

                      <motion.button
                        type="submit"
                        id="bk-submit"
                        whileHover={{ y: -3 }}
                        whileTap={{ scale: 0.98 }}
                        className="btn btn-primary mt-6 w-full"
                      >
                        Zarezerwuj termin <ArrowRight size={16} />
                      </motion.button>
                      <p className="muted mt-4 text-xs leading-relaxed">
                        Odwołanie wizyty możliwe do 3 godzin przed terminem.
                      </p>
                    </div>
                  </aside>
                </motion.form>
              )}
            </AnimatePresence>
          </div>
        </Reveal>
      </Container>
    </section>
  );
}
